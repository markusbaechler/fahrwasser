name: Deploy AIS relay

on:
  push:
    branches: [main]
    paths:
      - ais-relay-worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Account-ID ermitteln
        id: acct
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Worker deployen + Secret setzen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.acct.outputs.id }}
          command: deploy
          secrets: |
            AISSTREAM_API_KEY
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}

      - name: Relay-URL anzeigen
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ steps.acct.outputs.id }}
        run: |
          SUB=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/subdomain \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['subdomain'])")
          echo "### Relay-URL" >> "$GITHUB_STEP_SUMMARY"
          echo "https://fahrwasser-ais.$SUB.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "RELAY: https://fahrwasser-ais.$SUB.workers.dev"

      - name: Relay-URL ins Repo schreiben
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ steps.acct.outputs.id }}
        run: |
          SUB=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/subdomain \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['subdomain'])")
          URL="https://fahrwasser-ais.$SUB.workers.dev"
          echo "$URL" > relay-url.txt
          # Test
          curl -s -m 20 "$URL/?bbox=16.0,43.2,16.4,43.5" | head -c 400 > relay-test.txt || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add relay-url.txt relay-test.txt
          git diff --cached --quiet || git commit -m "CI: Relay-URL + Test"
          git push
