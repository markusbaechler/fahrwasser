<!doctype html>
<html lang="de" data-mode="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2536">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fahrwasser">
<meta name="description" content="Seekarte mit offenen Daten: Tiefen, Seezeichen, AIS, Wetter und Wasserstand.">
<meta property="og:title" content="Fahrwasser">
<meta property="og:description" content="Seekarte mit offenen Daten: Tiefen, Seezeichen, AIS, Wetter und Wasserstand.">
<title>Fahrwasser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
:root{
  --bg:#0F2536; --bg2:#163246; --line:#2A4A61; --text:#EEF3F5; --muted:#93A9B8;
  --accent:#F2B705; --on-accent:#1C1600; --own:#E8175D; --ok:#3FB56E; --err:#E5484D;
  --r:10px;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'Barlow Semi Condensed','Barlow',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
[data-mode=dusk]{--bg:#0B1B28;--bg2:#10273A;--line:#22405A;--text:#C9D5DC;--muted:#7C93A3;--accent:#C9980A}
/* Nacht: ausschliesslich Rot auf Schwarz, schützt die Dunkeladaption */
[data-mode=night]{--bg:#000;--bg2:#0A0000;--line:#330000;--text:#C21A1A;--muted:#7A0E0E;--accent:#8E0F0F;--on-accent:#000;--own:#C21A1A;--ok:#8E0F0F;--err:#C21A1A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--f);display:grid;grid-template-rows:auto 1fr auto auto;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.bar{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--line)}
.brand{font:600 21px/1 var(--fc);letter-spacing:.01em;margin-right:auto}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:500;font-size:15px}
.btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sq{width:48px;height:48px;padding:0}
.btn.wide{flex:1}

#wrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--bg)}
#tint{position:absolute;inset:0;pointer-events:none;background:#f00;mix-blend-mode:multiply;display:none;z-index:1}
[data-mode=night] #tint{display:block}
[data-mode=dusk] #map canvas{filter:invert(1) hue-rotate(180deg) brightness(.9) saturate(.85)}
[data-mode=night] #map canvas{filter:grayscale(1) invert(1) brightness(.6) contrast(1.2)}
#map.tool canvas{cursor:crosshair}
.maplibregl-ctrl-scale{background:var(--bg);color:var(--text);border-color:var(--text);font:500 12px var(--fc)}
.maplibregl-ctrl-attrib{background:var(--bg)!important;color:var(--muted)}
.maplibregl-ctrl-attrib a{color:var(--muted)}
.maplibregl-ctrl-attrib-button{filter:invert(1)}

.ov-l{position:absolute;top:10px;left:10px;z-index:2;display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:left .2s}
.ov-r{position:absolute;top:10px;right:10px;z-index:2;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px}
.chip{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:500 14px var(--f)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .n{font:600 14px var(--fc);font-variant-numeric:tabular-nums}
.wind{display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px 7px 8px}
.wind svg{grid-row:span 2;width:30px;height:30px;transition:transform .4s}
.wind .v{font:600 26px/1.05 var(--fc);font-variant-numeric:tabular-nums}
.wind .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.wind .s{font-size:13px;color:var(--muted)}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:5;background:var(--bg);border:1px solid var(--line);padding:10px 14px;border-radius:var(--r);width:max-content;max-width:min(92%,420px);font-size:14px}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;max-height:60%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:0 16px 16px}
.sheet-head{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:1}
.sheet-head h2{font:600 21px var(--fc);margin:0 auto 0 0}
@media (min-width:900px){
  .sheet{top:10px;bottom:10px;left:10px;right:auto;width:380px;max-height:none;border:1px solid var(--line);border-radius:14px}
  body.has-sheet .ov-l{left:400px}
}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.readout div{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.readout b{display:block;font:600 38px/1 var(--fc);font-variant-numeric:tabular-nums}
.readout b small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
.readout span{font-size:13px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:8px 0;font-size:15px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-family:var(--fc);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.note{color:var(--muted);font-size:14px;margin:8px 0}
.err{color:var(--err)}
table.t{width:100%;border-collapse:collapse;font:500 15px var(--fc);font-variant-numeric:tabular-nums}
table.t th{color:var(--muted);font-weight:500;text-align:right;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
.arr{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.list{list-style:none;margin:0;padding:0}
.list button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
.list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.list .mt{color:var(--muted);font:500 14px var(--fc);font-variant-numeric:tabular-nums;white-space:nowrap}
.list .old .nm{color:var(--muted)}
.menu{display:grid;gap:8px;margin-top:4px}
.menu .btn{justify-content:flex-start;min-height:52px}
input[type=text],input[type=url],input[type=number]{min-height:44px;width:100%;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2)}
form.inline{display:flex;gap:8px}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
.tide svg{width:100%;height:auto;display:block;margin:6px 0}

.status{display:flex;align-items:center;gap:10px;padding:4px 12px;min-height:40px;border-top:1px solid var(--line);font:500 15px var(--fc);font-variant-numeric:tabular-nums}
.status .pos{background:none;border:0;padding:6px 0;cursor:pointer;margin-left:auto;white-space:nowrap}
.status .acc{color:var(--muted);min-width:4.5em;text-align:right;white-space:nowrap}
.status .off{color:var(--err)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line)}
.tab{position:relative;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;cursor:pointer;font-size:13px;font-weight:500}
.tab[aria-current=true]{color:var(--accent)}
.tab[aria-current=true]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
@media (max-width:360px){.tab span{font-size:11px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <span class="brand">Fahrwasser</span>
  <button class="btn" id="modeBtn" type="button"><span id="modeIco"></span><span id="modeLbl"></span></button>
  <button class="btn" id="langBtn" type="button">EN</button>
</header>

<main id="wrap">
  <div id="map"></div>
  <div id="tint"></div>
  <div class="ov-l">
    <div class="chips">
      <button class="chip" id="chipAis" type="button"><span data-i18n="schiffe"></span><span class="n" id="aisN"></span></button>
      <button class="chip" id="chipWind" type="button"><span data-i18n="wind"></span></button>
    </div>
    <div class="wind" id="wind" hidden>
      <svg viewBox="0 0 24 24" id="windArr"><path d="M12 3v18M6 15l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="v" id="windV">–</div>
      <div class="s" id="windS"></div>
    </div>
  </div>
  <div class="ov-r">
    <button class="btn sq" id="zIn" type="button"></button>
    <button class="btn sq" id="zOut" type="button"></button>
    <button class="btn sq" id="locBtn" type="button"></button>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <button class="btn sq" id="backBtn" type="button" hidden></button>
      <h2 id="sheetTitle"></h2>
      <button class="btn sq" id="closeBtn" type="button"></button>
    </div>
    <div id="sheetBody"></div>
  </section>
</main>

<footer class="status">
  <span id="clock"></span>
  <button class="pos" id="posBtn" type="button"></button>
  <span class="acc" id="acc"></span>
</footer>

<nav class="tabs" id="tabs">
  <button class="tab" data-tab="fahrt" type="button"></button>
  <button class="tab" data-tab="messen" type="button"></button>
  <button class="tab" data-tab="route" type="button"></button>
  <button class="tab" data-tab="schiffe" type="button"></button>
  <button class="tab" data-tab="wetter" type="button"></button>
  <button class="tab" data-tab="mehr" type="button"></button>
</nav>

/* ---------- Wind entlang der Route ---------- */
async function loadRouteWx() {
  const r = S.route; if (r.length < 2) return;
  S.routeWxState = 'loading'; renderPanel();
  const spd = S.routeSpeed || 5, now = Date.now();
  const pts = r.map((p, k) => ({ p, k, course: k > 0 ? bearing(r[k - 1], p) : bearing(p, r[1]) }));
  let cum = 0; pts.forEach((w, k) => { if (k) cum += distNm(r[k - 1], w.p); w.eta = now + cum / spd * 3.6e6; });
  const lat = pts.map(w => w.p[1].toFixed(3)).join(','), lon = pts.map(w => w.p[0].toFixed(3)).join(',');
  try {
    const [w, m] = await Promise.allSettled([
      fetchJson(`${CFG.meteo}?latitude=${lat}&longitude=${lon}&timezone=auto&forecast_days=7&wind_speed_unit=kn&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m`),
      fetchJson(`${CFG.marine}?latitude=${lat}&longitude=${lon}&timezone=auto&forecast_days=7&hourly=wave_height`)
    ]);
    if (w.status !== 'fulfilled') throw new Error('wx');
    const W = [].concat(w.value), M = m.status === 'fulfilled' ? [].concat(m.value) : [];
    pts.forEach((wp, k) => {
      const d = W[k]; if (!d || !d.hourly) return;
      const local = new Date(wp.eta + (d.utc_offset_seconds || 0) * 1000).toISOString().slice(0, 13) + ':00';
      let i = d.hourly.time.findIndex(x => x >= local); if (i < 0) i = d.hourly.time.length - 1;
      wp.kn = d.hourly.wind_speed_10m[i]; wp.dir = d.hourly.wind_direction_10m[i]; wp.gust = d.hourly.wind_gusts_10m[i];
      const mm = M[k];
      if (mm && mm.hourly) { const j = mm.hourly.time.findIndex(x => x >= local); wp.wave = j >= 0 ? mm.hourly.wave_height[j] : null; }
    });
    S.routeWx = { at: now, pts }; S.routeWxState = 'ok';
  } catch { S.routeWxState = 'error'; }
  renderPanel();
}
function relWind(windFrom, course) {
  const a = ((windFrom - course) % 360 + 360) % 360, off = a > 180 ? 360 - a : a;
  const cls = off < 30 ? 0 : off < 60 ? 1 : off < 110 ? 2 : off < 150 ? 3 : 4;
  return `${t('rel' + cls)}${cls && cls < 4 ? ' ' + (a < 180 ? t('stbdS') : t('portS')) : ''}`;
}
function routeWxTable() {
  if (S.routeWxState === 'loading') return `<p class="note">${t('routeWxLoading')}</p>`;
  if (S.routeWxState === 'error') return `<p class="note err">${t('routeWxErr')}</p>`;
  if (!S.routeWx) return '';
  const rows = S.routeWx.pts.map(w => `<tr><td>${t('wp')}${w.k + 1}<br><span class="note">${new Date(w.eta).toLocaleString(loc(), { weekday: 'short', hour: '2-digit', minute: '2-digit' })}</span></td>
    <td>${w.kn != null ? `${Math.round(w.kn)} <span class="note">(${Math.round(w.gust)})</span><br><span class="note">${bft(w.kn)} Bft</span>` : '–'}</td>
    <td>${w.dir != null ? `${compass(w.dir)} <svg class="arr" viewBox="0 0 24 24" style="transform:rotate(${w.dir}deg)"><path d="M12 3v18M6 15l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5"/></svg><br><span class="note">${relWind(w.dir, w.course)}</span>` : '–'}</td>
    <td>${w.wave != null ? nf(w.wave) + ' m' : '–'}</td></tr>`).join('');
  return `<table class="t"><thead><tr><th>${t('eta')}</th><th>kn</th><th>${t('from')}</th><th>${t('waves')}</th></tr></thead><tbody>${rows}</tbody></table>

}

/* ---------- AIS ---------- */
function shipAgeMin(s) { return (Date.now() - s.seen) / 60000; }
function renderAis() {
  const now = Date.now();
  for (const [k, s] of S.ais) if (now - s.seen > CFG.aisDropMin * 60000) S.ais.delete(k);
  if (!src('ais')) return;
  if (!S.aisOn) { src('ais').setData(fc()); renderSel(); renderChips(); return; }
  const f = [];
  for (const s of S.ais.values()) {
    if (!isFinite(s.lat) || !isFinite(s.lon)) continue;
    const old = shipAgeMin(s) > CFG.aisStaleMin, moving = s.sog >= .5 && s.cog != null;
    f.push(pt([s.lon, s.lat], {
      mmsi: s.mmsi, img: (moving ? 'fw-ship' : 'fw-moor') + (old ? '-old' : ''),
      rot: s.hdg != null ? s.hdg : (s.cog ?? 0)
    }));

}
function shipsInView() {
  const b = map.getBounds();
  return [...S.ais.values()].filter(s => isFinite(s.lat) && b.contains([s.lon, s.lat]));
}
async function pollAis() {
  if (!S.aisOn) return;
  if (!S.relay) { S.aisStatus = 'norelay'; return afterAis(); }
  if (map.getZoom() < CFG.aisMinZoom) { S.aisStatus = 'zoom'; return afterAis(); }
  if (!S.online) return;
  const b = map.getBounds();
  const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(v => v.toFixed(3)).join(',');
  S.aisStatus = S.aisAt ? S.aisStatus : 'loading'; afterAis(true);
  try {
    const j = await fetchJson(`${S.relay}${S.relay.includes('?') ? '&' : '?'}bbox=${bbox}`, 25000);
    const now = Date.now();
    for (const r of j.ships || []) {
      if (!r.mmsi) continue;
      const prev = S.ais.get(r.mmsi) || { mmsi: r.mmsi, seen: 0 };
      const clean = Object.fromEntries(Object.entries(r).filter(([, v]) => v != null && v !== ''));
      const seen = r.t ? (Date.parse(r.t) || now) : prev.seen || now;

/* ---------- GPS ---------- */
function startGps() {

  if (!('geolocation' in navigator)) { toast(t('gpsNone')); return; }
  S.watchId = navigator.geolocation.watchPosition(onPos, err => {
    toast(err.code === 1 ? t('gpsDenied') : t('gpsNone'));
    if (err.code === 1) stopGps();

}
function stopGps() {

  if (S.panel === 'fahrt') renderPanel();
}
function onPos(pos) {
  const c = pos.coords, p = [c.longitude, c.latitude], prev = S.own;
  let sog = c.speed != null && c.speed >= 0 ? c.speed * 1.943844 : null;
  let cog = c.heading != null && isFinite(c.heading) && sog > .3 ? c.heading : null;
  if (prev) {
    const dtH = (pos.timestamp - prev.t) / 3.6e6, d = distNm(prev.p, p);
    if (dtH > 0 && d > .005) { if (sog == null) sog = d / dtH; if (cog == null) cog = bearing(prev.p, p); }
    else if (cog == null) cog = prev.cog;
  }
  S.own = { p, acc: c.accuracy, sog, cog, t: pos.timestamp };
  if (S.tracking) {
    const last = S.track[S.track.length - 1];
    if (!last || distNm([last[0], last[1]], p) > .01) {
      S.track.push([+p[0].toFixed(6), +p[1].toFixed(6), pos.timestamp]);
      store.set('track', S.track); renderTrack();
    }
  }
  if (S.follow) map.easeTo({ center: p, duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 600 });
  renderOwn(); renderNav(); navUpdate(); renderStatus();
  if (S.panel === 'fahrt' || (S.panel === 'route' && S.nav.on)) renderPanel();
}

  const p = o.props, type = p.type || p['seamark:type'] || '';
  const rows = [];
  const tl = SEAMARK[lang][type] || SEAMARK.de[type];
  if (tl || type) rows.push([t('type'), esc(tl || vt(type))]);
  if (p.category) rows.push([lang === 'de' ? 'Kategorie' : 'Category', esc(vt(p.category))]);
  rows.push(...lightRows(p));
  const skip = /^(name|type|category|seamark:type|seamark:name|seamark:light|source|.*:source$|ref|osm_id)/;
  const pretty = k => k.replace(/^seamark:/, '').replace(new RegExp('^' + type.replace(/[^\w]/g, '') + ':'), '').replace(/_/g, ' ');
  const LBL = { colour: t('colour'), shape: t('shape'), 'topmark:shape': t('topmark'), 'topmark:colour': `${t('topmark')} ${t('colour').toLowerCase()}`, height: t('height') };
  for (const [k, v] of Object.entries(p)) {
    if (skip.test(k) || v === '' || v == null || typeof v === 'object') continue;
    const key = pretty(k);
    rows.push([esc(LBL[key] || key), esc(vt(v))]);
    if (rows.length > 16) break;
  }
  const ref = S.own ? S.own.p : null;
  rows.push([t('position'), fmtPos(o.geom)]);
  if (ref) rows.push([t('distFrom'), `${nf(distNm(ref, o.geom), 2)} sm ${deg3(bearing(ref, o.geom))}`]);
  const more = S.objs.length > 1 ? `<p class="note">${t('objMore')}</p><ul class="list">${S.objs.map((x, i) => i === S.objIdx ? '' : `<li><button type="button" data-act="obj" data-i="${i}"><span class="nm">${esc(objTitle(x))}</span></button></li>`).join('')}</ul>` : '';
  return `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd style="text-align:left">${v}</dd>`).join('')}</dl>${more}`;
}

function aisStatusText() {
  return { norelay: t('aisNoRelay'), zoom: t('aisZoom'), loading: t('aisLoading'), error: t('aisError'), notcfg: t('aisNotCfg'),
    ok: `${t('aisOk')} ${S.aisAt ? fmtAge(Date.now() - S.aisAt) : ''}`, idle: '' }[S.aisStatus] || '';
}
function pSchiffe() {
  const ref = S.own ? S.own.p : [map.getCenter().lng, map.getCenter().lat];
  const list = S.aisOn ? shipsInView().map(s => ({ s, d: distNm(ref, [s.lon, s.lat]) })).sort((a, b) => a.d - b.d).slice(0, 40) : [];
  const items = list.map(({ s, d }) => {
    const old = shipAgeMin(s) > CFG.aisStaleMin;
    return `<li class="${old ? 'old' : ''}"><button type="button" data-act="ship" data-mmsi="${s.mmsi}">
      <span class="nm">${esc(shipName(s))}</span>
      <span class="mt">${nf(s.sog)} kn</span>
      <span class="mt">${nf(d, 1)} sm ${deg3(bearing(ref, [s.lon, s.lat]))}</span></button></li>`;
  }).join('');
  const st = aisStatusText();
  return `<div class="row">${btn('aisToggle', t('aisOn'), `aria-pressed="${S.aisOn}"`)}</div>
    ${S.aisOn && st ? `<p class="note ${S.aisStatus === 'error' || S.aisStatus === 'notcfg' ? 'err' : ''}">${esc(st)}</p>` : ''}
    ${S.aisOn ? (items ? `<p class="note">${list.length} ${t('inView')}, ${t('older')} ${CFG.aisStaleMin} ${t('minutes')} ${t('greyed')}</p><ul class="list">${items}</ul>`
      : (S.aisStatus === 'ok' ? `<p class="note">${t('aisNone')}</p>` : '')) : ''}`;
}
function pShip() {
  const s = S.ais.get(S.selected);
  if (!s) return `<p class="note">${t('aisNone')}</p>`;
  const ref = S.own ? S.own.p : null;
  const rows = [
    [t('sog'), s.sog != null ? `${nf(s.sog)} kn` : null],
    [t('cog'), s.cog != null ? deg3(s.cog) : null],
    [t('hdg'), s.hdg != null ? deg3(s.hdg) : null],
    [t('status'), s.nav != null ? NAVSTAT[lang][s.nav] : null],
    [t('type'), shipType(s.type)],
    [t('dest'), s.dest ? esc(s.dest) : null],
    [t('len'), s.len ? `${s.len} m` : null],
    [t('position'), fmtPos([s.lon, s.lat])],
    [t('distFrom'), ref ? `${nf(distNm(ref, [s.lon, s.lat]), 2)} sm ${deg3(bearing(ref, [s.lon, s.lat]))}` : null],
    [t('seen'), fmtAge(Date.now() - s.seen)],
    [t('mmsi'), s.mmsi]
  ].filter(r => r[1] != null);
  return `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

function pWetter() {
  if (!S.wx) return `<p class="note ${S.wxErr ? 'err' : ''}">${S.wxErr ? t('wxError') : t('wxLoading')}</p>`;
  const c = S.wx.current, h = S.wx.hourly;
  const mi = {};
  if (S.marine && S.marine.hourly) S.marine.hourly.time.forEach((tm, i) => mi[tm] = i);
  const mh = S.marine && S.marine.hourly;
  const i0 = Math.max(0, h.time.findIndex(x => x >= c.time.slice(0, 13) + ':00'));
  const wNow = mh && mi[h.time[i0]] != null ? mh.wave_height[mi[h.time[i0]]] : null;
  const rows = [];
  for (let i = i0; i < Math.min(h.time.length, i0 + 25); i += 2) {
    const j = mi[h.time[i]], wv = mh && j != null ? mh.wave_height[j] : null;
    rows.push(`<tr><td>${h.time[i].slice(11, 16)}</td>
      <td>${Math.round(h.wind_speed_10m[i])} <span class="note">(${Math.round(h.wind_gusts_10m[i])})</span></td>
      <td>${compass(h.wind_direction_10m[i])} <svg class="arr" viewBox="0 0 24 24" style="transform:rotate(${h.wind_direction_10m[i]}deg)"><path d="M12 3v18M6 15l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5"/></svg></td>
      <td>${wv != null ? nf(wv) + ' m' : '–'}</td>
      <td>${h.precipitation_probability[i] ?? '–'} %</td></tr>`);
  }
  return `<div class="readout">
      <div><b>${Math.round(c.wind_speed_10m)}<small>kn</small></b><span>${bft(c.wind_speed_10m)} Bft ${t('from')} ${compass(c.wind_direction_10m)}</span></div>
      <div><b>${wNow != null ? nf(wNow) : '–'}<small>m</small></b><span>${t('waves')}</span></div>
    </div>
    <dl class="kv"><dt>${t('gusts')}</dt><dd>${Math.round(c.wind_gusts_10m)} kn</dd></dl>
    <table class="t"><thead><tr><th>${t('time')}</th><th>kn</th><th>${t('from')}</th><th>${t('waves')}</th><th>${t('rain')}</th></tr></thead><tbody>${rows.join('')}</tbody></table>
    <p class="note">${t('wxAt')} ${c.time.slice(11, 16)} ${esc(S.wx.timezone_abbreviation || '')}, ${t('wxFor')}.</p>
    <div class="row">${btn('wxRefresh', t('refresh'))}</div>`;
}

function pMehr() {
  return `<div class="menu">${['ort', 'gezeiten', 'info'].map(k => `<button class="btn" type="button" data-act="open" data-to="${k}">${ico(k)}${t(k)}</button>`).join('')}</div>`;
}
function pOrt() {
  const res = S.searchState === 'loading' ? `<p class="note">${t('searching')}</p>`
    : S.searchState === 'none' ? `<p class="note">${t('noResults')}</p>`
    : S.searchState === 'error' ? `<p class="note err">${t('searchErr')}</p>`
    : `<ul class="list">${S.searchRes.map((r, i) => `<li><button type="button" data-act="goto" data-i="${i}"><span class="nm">${esc(r.name)}</span></button></li>`).join('')}</ul>`;
  return `<form class="inline" data-form="search">
      <input type="text" name="q" value="${esc(S.searchQ)}" placeholder="${t('searchPh')}" aria-label="${t('search')}" autocomplete="off" enterkeyhint="search">
      <button class="btn" type="submit">${t('search')}</button>
    </form>${res}`;
}
function pGezeiten() {
  const mh = S.marine && S.marine.hourly;
  if (!mh) return `<p class="note">${S.marineErr ? t('tideNone') : t('tideLoading')}</p>`;
  const v = mh.sea_level_height_msl || [], tm = mh.time;
  if (!v.some(x => x != null)) return `<p class="note">${t('tideNone')}</p>`;
  const nowStr = new Date(Date.now() + (S.marine.utc_offset_seconds || 0) * 1000).toISOString().slice(0, 13) + ':00';
  const i0 = Math.max(0, tm.findIndex(x => x >= nowStr));
  const a = Math.max(0, i0 - 6), b = Math.min(tm.length, i0 + 48);
  const xs = tm.slice(a, b), ys = v.slice(a, b).map(y => y ?? NaN);
  const valid = ys.filter(isFinite), lo = Math.min(...valid), hi = Math.max(...valid), span = (hi - lo) || .1;
  const W = 340, H = 130, pad = 10;
  const X = i => pad + i * (W - 2 * pad) / (xs.length - 1), Y = y => H - pad - (y - lo) / span * (H - 2 * pad);
  const d = ys.map((y, i) => isFinite(y) ? `${i && isFinite(ys[i - 1]) ? 'L' : 'M'}${X(i).toFixed(1)},${Y(y).toFixed(1)}` : '').join('');
  const nx = X(i0 - a);
  const ext = [];
  for (let i = Math.max(1, i0 - a); i < ys.length - 1; i++) {
    if (ys[i] > ys[i - 1] && ys[i] >= ys[i + 1]) ext.push([i, 'high']);
    else if (ys[i] < ys[i - 1] && ys[i] <= ys[i + 1]) ext.push([i, 'low']);
  }
  const day = s => { const [y, m, dd] = s.slice(0, 10).split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)).toLocaleDateString(loc(), { weekday: 'short', timeZone: 'UTC' }); };
  const rows = ext.slice(0, 8).map(([i, k]) => `<tr><td>${day(xs[i])} ${xs[i].slice(11, 16)}</td><td>${t(k)}</td><td>${ys[i] >= 0 ? '+' : ''}${Math.round(ys[i] * 100)} cm</td></tr>`).join('');
  return `<div class="tide"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('gezeiten')}">
      <line x1="${pad}" x2="${W - pad}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
      <line x1="${nx}" x2="${nx}" y1="${pad}" y2="${H - pad}" stroke="var(--text)" stroke-width="1.5"/>
    </svg></div>
    <table class="t"><thead><tr><th>${t('time')}</th><th></th><th>MSL</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="note">${t('tideNote')}</p>`;
}
function pInfo() {
  return `<label class="f" for="relay">${t('relay')}</label>
    <form class="inline" data-form="relay">
      <input id="relay" type="url" name="relay" value="${esc(S.relay)}" placeholder="https://…" autocomplete="off" inputmode="url">
      <button class="btn" type="submit">${t('save')}</button>
    </form>
    <p class="note">${t('relayHelp')}</p>
    <div class="row">${btn('relayTest', t('relayTest'), S.relay ? '' : 'disabled')}</div>
    ${S.relayTest ? `<p class="note ${S.relayTest.startsWith(t('relayFail')) ? 'err' : ''}">${esc(S.relayTest)}</p>` : ''}
    <h3 style="font:600 17px var(--fc);margin:20px 0 6px">${t('sources')}</h3>
    <p class="note">${[t('srcChart'), t('srcDepth'), t('srcWx'), t('srcGeo'), t('srcAis')].map(esc).join('<br>')}</p>
    <div class="row">${btn('clearCache', t('clearCache'))}</div>
    <p class="note">Fahrwasser ${CFG.version}</p>`;
}

/* ---------- Aktionen ---------- */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function gpx(kind, pts) {
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  const head = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Fahrwasser" xmlns="http://www.topografix.com/GPX/1/1">\n';
  const body = kind === 'rte'
    ? `<rte><name>Fahrwasser ${stamp}</name>\n${pts.map((p, i) => `<rtept lat="${p[1].toFixed(6)}" lon="${p[0].toFixed(6)}"><name>WP${i + 1}</name></rtept>`).join('\n')}\n</rte>`
    : `<trk><name>Fahrwasser ${stamp}</name><trkseg>\n${pts.map(p => `<trkpt lat="${p[1].toFixed(6)}" lon="${p[0].toFixed(6)}">${p[2] ? `<time>${new Date(p[2]).toISOString()}</time>` : ''}</trkpt>`).join('\n')}\n</trkseg></trk>`;
  download(`fahrwasser-${kind === 'rte' ? 'route' : 'track'}-${stamp}.gpx`, head + body + '\n</gpx>\n', 'application/gpx+xml');
}
const saveRoute = () => { store.set('route', S.route); S.routeWx = null; S.routeWxState = 'idle'; if (S.nav.wp >= S.route.length) S.nav.wp = Math.max(0, S.route.length - 1); if (!S.route.length) S.nav.on = false; renderNav(); };

const ACTIONS = {
  gps: () => S.watchId != null ? stopGps() : startGps(),
  follow: () => { S.follow = !S.follow; if (S.follow && S.own) map.easeTo({ center: S.own.p }); renderPanel(); },
  track: () => { S.tracking = !S.tracking; if (S.tracking) startGps(); renderPanel(); },
  trackGpx: () => gpx('trk', S.track),
  trackClear: () => { S.track = []; store.set('track', []); renderTrack(); renderPanel(); },
  measureOwn: () => { if (S.own) { S.measure = [S.own.p]; renderMeasure(); renderPanel(); } },
  measureReset: () => { S.measure = []; renderMeasure(); renderPanel(); },
  routeUndo: () => { S.route.pop(); saveRoute(); renderRoute(); renderPanel(); },
  routeRev: () => { S.route.reverse(); saveRoute(); renderRoute(); renderPanel(); },
  routeGpx: () => gpx('rte', S.route),
  routeClear: () => { S.route = []; saveRoute(); renderRoute(); renderPanel(); },
  aisToggle: () => toggleAis(),
  navStart: () => { S.nav = { on: true, wp: 0 }; startGps(); renderNav(); renderPanel(); },
  navStop: () => { S.nav.on = false; renderNav(); renderPanel(); },
  navNext: () => { S.nav.wp = Math.min(S.route.length - 1, S.nav.wp + 1); renderNav(); renderPanel(); },
  navPrev: () => { S.nav.wp = Math.max(0, S.nav.wp - 1); renderNav(); renderPanel(); },
  routeWx: () => loadRouteWx(),
  obj: el => { S.objIdx = +el.dataset.i; renderPanel(); },
  relayTest: async () => {
    if (!S.relay) return;
    const c = map.getCenter();
    const bbox = [c.lng - .5, c.lat - .3, c.lng + .5, c.lat + .3].map(v => v.toFixed(2)).join(',');
    S.relayTest = t('testing'); renderPanel();
    try {
      const j = await fetchJson(`${S.relay}${S.relay.includes('?') ? '&' : '?'}bbox=${bbox}`, 25000);
      S.relayTest = `${t('relayOk')}: ${(j.ships || []).length} ${t('ships')}`;
    } catch (e) { S.relayTest = `${t('relayFail')}: ${(e.body && e.body.error) || e.message}`; }
    renderPanel();
  },
  ship: el => { S.selected = Number(el.dataset.mmsi); const s = S.ais.get(S.selected); if (s) map.easeTo({ center: [s.lon, s.lat] }); openPanel('ship'); renderSel(); },
  wxRefresh: () => { S.wx = null; renderPanel(); loadWx(true); },
  open: el => openPanel(el.dataset.to),
  goto: el => { const r = S.searchRes[+el.dataset.i]; if (r) map.flyTo({ center: [r.lon, r.lat], zoom: Math.max(map.getZoom(), 12) }); },
  clearCache: async () => {
    try { const keys = await caches.keys(); await Promise.all(keys.filter(k => k.startsWith('fw-tiles')).map(k => caches.delete(k))); } catch {}
    toast(t('cacheCleared'));
  }
};
$('sheetBody').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
$('sheetBody').addEventListener('change', e => {
  if (e.target.dataset.input === 'speed') {
    const v = parseFloat(String(e.target.value).replace(',', '.'));
    if (v > 0) { S.routeSpeed = v; store.set('routeSpeed', v); S.routeWx = null; S.routeWxState = 'idle'; renderPanel(); }
  }
});
$('sheetBody').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === 'relay') {
    S.relay = f.relay.value.trim().replace(/\/+$/, '');
    store.set('relay', S.relay); S.aisAt = null; toast(t('saved')); pollAis();
  }
  if (kind === 'search') {
    const q = S.searchQ = f.q.value.trim();
    if (!q) return;
    const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (m && Math.abs(+m[1]) <= 90 && Math.abs(+m[2]) <= 180) { map.flyTo({ center: [+m[2], +m[1]], zoom: Math.max(map.getZoom(), 12) }); return; }
    S.searchState = 'loading'; renderPanel();
    try {
      const j = await fetchJson(`${CFG.geocode}?format=jsonv2&limit=8&accept-language=${lang}&q=${encodeURIComponent(q)}`);
      S.searchRes = j.map(r => ({ name: r.display_name, lat: +r.lat, lon: +r.lon }));
      S.searchState = j.length ? 'ok' : 'none';
    } catch { S.searchState = 'error'; }
    renderPanel();
  }
});
function toggleAis() {
  S.aisOn = !S.aisOn; store.set('aisOn', S.aisOn);
  renderAis(); if (S.aisOn) pollAis();
  if (S.panel === 'schiffe') renderPanel();
}

/* ---------- Kopfzeile, Tabs, Steuerung ---------- */
$('modeBtn').onclick = () => { S.mode = MODES[(MODES.indexOf(S.mode) + 1) % 3]; store.set('mode', S.mode); applyMode(); };
$('langBtn').onclick = () => { lang = lang === 'de' ? 'en' : 'de'; store.set('lang', lang); applyLang(); };
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  const name = b.dataset.tab;
  (S.panel === name || TAB_OF[S.panel] === name) ? closePanel() : openPanel(name);
});
$('closeBtn').onclick = closePanel;
$('backBtn').onclick = () => openPanel(TAB_OF[S.panel]);
$('zIn').onclick = () => map.zoomIn();
$('zOut').onclick = () => map.zoomOut();
$('locBtn').onclick = () => {
  startGps(); S.follow = true;
  if (S.own) map.easeTo({ center: S.own.p, zoom: Math.max(map.getZoom(), 12) });
  if (S.panel === 'fahrt') renderPanel();
};
$('chipAis').onclick = toggleAis;
$('chipWind').onclick = () => { S.windOn = !S.windOn; store.set('windOn', S.windOn); renderWind(); renderChips(); };
$('posBtn').onclick = () => { S.coordFmt = S.coordFmt === 'dm' ? 'dec' : 'dm'; store.set('coordFmt', S.coordFmt); renderStatus(); if (S.panel) renderPanel(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.panel) closePanel(); });
addEventListener('online', () => { S.online = true; renderStatus(); toast(t('online')); pollAis(); loadWx(true); });
addEventListener('offline', () => { S.online = false; renderStatus(); toast(t('offline'), 6000); });

/* ---------- Start ---------- */
applyLang();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service Worker:', err));
}
</script>
</body>
</html>
